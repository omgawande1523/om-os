    <!-- Apply the saved / system theme before first paint (no flash). -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>

  <body>
    <!--
      Decorative boot screen. It sits over the already-rendered page, lasts ≤ 650 ms, shows once
      per session, is skippable with any key / click / tap, is skipped for prefers-reduced-motion
      and is hidden from assistive tech.
    -->
    <div id="boot" aria-hidden="true" hidden style="position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--neo-bg,#FAF6EE);font-family:'JetBrains Mono',monospace">
      <div style="text-align:center">
        <p style="font-size:3rem;font-weight:800;color:var(--neo-text,#111);margin:0 0 1rem">OM<span style="color:#FFC4D0">.</span>OS</p>
        <p style="font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin:0 0 .5rem;color:var(--neo-text,#111)">Initializing core modules</p>
        <div style="width:16rem;height:8px;border:1px solid currentColor;padding:2px;margin:0 auto;color:var(--neo-text,#111)"><div class="boot-bar" style="height:100%;background:currentColor"></div></div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('boot');
        try {
          if (matchMedia('(prefers-reduced-motion: reduce)').matches || sessionStorage.getItem('om_os_booted')) return el.remove();
          sessionStorage.setItem('om_os_booted', '1');
        } catch (e) {}
        el.hidden = false;
        var done = function () {
          if (el.parentNode) el.remove();
          removeEventListener('keydown', done);
          removeEventListener('pointerdown', done);
        };
        addEventListener('keydown', done);
        addEventListener('pointerdown', done);
        setTimeout(done, 650);
      })();
    </script>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
